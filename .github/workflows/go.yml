name: Go
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Go version
      run: go version
    - name: Download dependencies
      run: go mod download
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...
